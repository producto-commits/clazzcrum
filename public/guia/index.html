<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Guía del cliente — Portal de Clazz</title>
<link rel="icon" href="/clazz-logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0f1513; --surface:#16201b; --surface-2:#1c2823;
    --border:#243330; --border-strong:#31463f;
    --fg:#e9f1ed; --muted:#91a099;
    --brand:#2ec089; --brand-soft:rgba(46,192,137,.14);
    --danger:#f0656a; --warning:#e0a04a; --info:#4aa3e0;
    --radius:14px; --nav-w:300px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg); color:var(--fg);
    font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    line-height:1.65; font-size:15.5px; -webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif; line-height:1.2; letter-spacing:-.01em}
  a{color:var(--brand); text-decoration:none}
  a:hover{text-decoration:underline}
  code{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace; font-size:.84em;
    background:var(--surface-2); border:1px solid var(--border); padding:.06em .42em; border-radius:6px; color:#bfeeda; white-space:nowrap}
  .layout{display:flex; min-height:100vh}
  .side{width:var(--nav-w); flex:0 0 var(--nav-w); background:var(--surface); border-right:1px solid var(--border);
    position:sticky; top:0; height:100vh; overflow-y:auto; padding:22px 16px 40px}
  .brand{display:flex; align-items:center; gap:10px; padding:6px 8px 18px; border-bottom:1px solid var(--border); margin-bottom:10px}
  .brand img{width:34px;height:34px;border-radius:50%}
  .brand .n{font-family:"Space Grotesk";font-weight:700;font-size:18px;line-height:1}
  .brand .s{font-size:10px;letter-spacing:.2em;color:var(--muted);font-weight:600}
  .navlink{display:flex; align-items:center; gap:9px; width:100%; text-align:left; padding:9px 12px; border-radius:10px;
    color:var(--muted); font-size:14.5px; font-weight:500; background:none; border:none; cursor:pointer; font-family:inherit; transition:.15s; line-height:1.35}
  .navlink:hover{background:var(--surface-2); color:var(--fg); text-decoration:none}
  .navlink.active{background:var(--brand-soft); color:var(--brand); font-weight:600}
  .navlink .num{width:20px;flex:none;font-size:11px;font-weight:700;opacity:.6;font-family:"JetBrains Mono",monospace}
  .main{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center}
  .content{width:100%; max-width:840px; padding:38px 34px 90px}
  .crumb{font-size:12.5px;color:var(--muted);margin-bottom:10px}
  .crumb b{color:var(--brand);font-weight:600}
  .content h1{font-size:31px;margin:.1em 0 .3em}
  .content h2{font-size:20px;margin:1.9em 0 .5em}
  .content p{margin:.6em 0}
  .lead{font-size:17px;color:#c7d6ce}
  .content ul{margin:.5em 0 .9em; padding-left:1.2em}
  .content li{margin:.3em 0}
  .content img{width:100%;border-radius:var(--radius);border:1px solid var(--border-strong);margin:1em 0;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  figure{margin:1.2em 0}
  figcaption{font-size:12.5px;color:var(--muted);text-align:center;margin-top:.5em}
  .callout{border-left:3px solid var(--brand);background:var(--brand-soft);border-radius:8px;padding:12px 16px;margin:1.1em 0;font-size:14.5px}
  .callout.warn{border-left-color:var(--warning);background:rgba(224,160,74,.10)}
  .callout .t{font-weight:600;margin-bottom:2px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin:1.1em 0}
  table{width:100%;border-collapse:collapse;margin:1.1em 0;font-size:14px}
  th,td{border:1px solid var(--border);padding:9px 12px;text-align:left;vertical-align:top}
  th{background:var(--surface-2);font-weight:600;color:#cfe7dd}
  ol.steps{counter-reset:s;list-style:none;padding:0;margin:1.1em 0}
  ol.steps>li{counter-increment:s;position:relative;padding:3px 0 16px 44px;margin:0 0 0 13px;border-left:1px solid var(--border)}
  ol.steps>li:last-child{border-left:1px solid transparent}
  ol.steps>li::before{content:counter(s);position:absolute;left:-13px;top:0;width:26px;height:26px;border-radius:50%;
    background:var(--surface-2);color:var(--brand);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(46,192,137,.4)}
  .req{color:var(--warning);font-weight:600;font-size:12px}
  .pager{display:flex;justify-content:space-between;gap:12px;margin-top:44px;border-top:1px solid var(--border);padding-top:22px}
  .pager a{flex:1;display:block;padding:14px 16px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--fg)}
  .pager a:hover{border-color:var(--brand);text-decoration:none}
  .pager .lbl{font-size:11.5px;color:var(--muted)}
  .pager .ttl{font-weight:600;color:var(--brand);margin-top:2px;font-size:14px}
  .pager .next{text-align:right}
  .pager .empty{visibility:hidden}
  .topbar{display:none}
  @media (max-width:900px){
    .side{position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);transition:.25s;box-shadow:0 0 40px rgba(0,0,0,.6)}
    .side.open{transform:none}
    .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px}
    .burger{background:var(--surface-2);border:1px solid var(--border);color:var(--fg);border-radius:9px;padding:7px 11px;font-size:18px;cursor:pointer}
    .content{padding:24px 18px 70px}
    .content h1{font-size:25px}
    .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
    .scrim.show{display:block}
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="side" id="side">
    <div class="brand">
      <img src="/clazz-logo.png" alt="Clazz" />
      <div><div class="n">Clazz</div><div class="s">GUÍA DEL CLIENTE</div></div>
    </div>
    <nav id="nav"></nav>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <div class="topbar"><button class="burger" id="burger" aria-label="Menú">☰</button><strong>Guía del cliente</strong></div>
    <div class="content">
      <div class="crumb" id="crumb"></div>
      <article id="article"></article>
      <div class="pager" id="pager"></div>
    </div>
  </div>
</div>
<script>
const IMG = "/guia/capturas/";
const img = (f,cap) => '<figure><img src="'+IMG+f+'" alt="'+cap+'"><figcaption>'+cap+'</figcaption></figure>';
const REQ = '<span class="req">(obligatorio)</span>';

const SECTIONS = [
  { id:"bienvenida", nav:"Bienvenida", title:"Bienvenido a tu portal", html:`
    <p class="lead">Este es tu portal de cliente en Clazz: el lugar donde sigues tu proyecto con el equipo de <b>Clazz Digital</b>, apruebas los documentos y pides ayuda cuando lo necesitas.</p>
    <p>Es sencillo: tiene solo <b>tres secciones</b>.</p>
    <table>
      <tr><th>Sección</th><th>Para qué te sirve</th></tr>
      <tr><td><b>Mis proyectos</b></td><td>Ver cómo avanza tu proyecto, paso a paso.</td></tr>
      <tr><td><b>Mis aprobaciones</b></td><td>Revisar y aprobar los documentos que te envía el equipo.</td></tr>
      <tr><td><b>Mis tickets</b></td><td>Pedir soporte y seguir la respuesta del equipo.</td></tr>
    </table>
    <div class="callout"><div class="t">No necesitas conocimientos técnicos</div>Todo está pensado para que lo uses tú mismo, sin ayuda. Esta guía te muestra cada cosa con imágenes reales.</div>
  `},
  { id:"ingresar", nav:"Iniciar sesión", title:"Entrar a tu portal", html:`
    <p>El equipo de Clazz te creó una cuenta con tu correo. Para entrar:</p>
    ${img("c01-login.png","Pantalla de inicio de sesión")}
    <ol class="steps">
      <li>Abre el enlace de Clazz que te compartieron.</li>
      <li>Escribe tu <b>Correo electrónico</b> y tu <b>Contraseña</b>.</li>
      <li>Pulsa <code>Entrar</code>. Entrarás directo a tu portal.</li>
    </ol>
    <div class="callout warn"><div class="t">¿Olvidaste tu contraseña?</div>Usa el enlace <code>¿Olvidaste tu contraseña?</code> para recibir un código y crear una nueva.</div>
  `},
  { id:"proyectos", nav:"Ver el avance", title:"Ver el avance de tu proyecto", html:`
    <p>En <b>Mis proyectos</b> ves todos tus proyectos con su estado y avance.</p>
    ${img("c02-mis-proyectos.png","Mis proyectos: cada tarjeta muestra el avance")}
    <ol class="steps">
      <li>Entra a <code>Mis proyectos</code>.</li>
      <li>Cada tarjeta muestra el nombre, su estado y cuántos hitos y actividades tiene.</li>
      <li>Pulsa <code>Ver avance →</code> para ver el detalle.</li>
    </ol>
    <p>Dentro verás el <b>avance general</b> y el progreso de cada <b>hito</b> (las grandes etapas del proyecto) con sus fechas.</p>
    ${img("c03-proyecto-avance.png","Detalle del avance por hitos y fases")}
    <div class="callout">Esta vista es <b>solo de consulta</b>: te mantiene al tanto sin que tengas que preguntar. El equipo de Clazz es quien actualiza el trabajo.</div>
  `},
  { id:"aprobar", nav:"Aprobar un documento", title:"Aprobar o comentar un documento", html:`
    <p>Cuando el equipo te envía un documento (una propuesta de diseño, un manual, una entrega…), aparece en <b>Mis aprobaciones</b> para tu revisión.</p>
    ${img("c04-mis-aprobaciones.png","Mis aprobaciones: pestañas “Por aprobar” y “Aprobados”")}
    <ol class="steps">
      <li>Entra a <code>Mis aprobaciones</code>. En <code>Por aprobar</code> están los que esperan tu revisión.</li>
      <li>Abre el documento: podrás <b>leer el PDF</b> completo dentro de la página.</li>
      <li>Si necesitas cambios, escribe en <b>Dejar un comentario</b> y pulsa <code>Enviar comentario</code>. El equipo lo verá.</li>
      <li>Si todo está bien, pulsa <code>✓ Aprobar documento</code> y confirma.</li>
    </ol>
    ${img("c05-documento-aprobar.png","Lectura del PDF con las opciones de aprobar o comentar")}
    <div class="callout warn"><div class="t">Importante</div>Cuando <b>apruebas</b> un documento, queda cerrado: no podrás dejar más comentarios ni cambiarlo. Si después necesitas ajustes, escríbele al equipo por un ticket.</div>
  `},
  { id:"enviar-ticket", nav:"Pedir soporte", title:"Enviar un ticket de soporte", html:`
    <p>¿Algo no funciona o tienes una duda? Abre un ticket y el equipo de Clazz te responderá.</p>
    ${img("c06-mis-tickets.png","Mis tickets, con el botón “+ Enviar ticket”")}
    <ol class="steps">
      <li>Entra a <code>Mis tickets</code> y pulsa <code>+ Enviar ticket</code>.</li>
      <li>Escribe un <b>Asunto</b> ${REQ} corto — ej: <i>No puedo ver el reporte</i>.</li>
      <li>En la <b>descripción</b> ${REQ}, cuenta qué pasó, desde cuándo y qué esperabas.</li>
      <li>Si ayuda, <b>adjunta un archivo</b> (una captura de pantalla, un PDF…).</li>
      <li>Elige la <b>Prioridad</b> y pulsa <code>Enviar ticket</code>.</li>
    </ol>
    ${img("c07-modal-enviar-ticket.png","Formulario para enviar un ticket")}
    <div class="callout">Un buen ticket incluye una <b>captura de pantalla</b>: nos ayuda a entender y resolver más rápido.</div>
  `},
  { id:"seguir-ticket", nav:"Seguir mis tickets", title:"Seguir la respuesta a tus tickets", html:`
    <p>Todos tus casos quedan en <b>Mis tickets</b>, separados en <code>Abiertos</code> y <code>Cerrados</code>.</p>
    <ol class="steps">
      <li>Abre el ticket para ver la <b>conversación</b> con el equipo.</li>
      <li>Escribe tu respuesta en el cuadro de mensaje y pulsa <code>Enviar</code>.</li>
      <li>Sigue su <b>estado</b> (Nuevo, Asignado, En proceso, Resuelto…) en la parte superior.</li>
    </ol>
    ${img("c08-ticket-detalle.png","Detalle de un ticket con su conversación")}
    <div class="callout"><div class="t">Cuando quede resuelto</div>Podrás <b>calificar la atención</b> con estrellas. Y si el tema vuelve a pasar, tu respuesta reabre el caso automáticamente.</div>
    <div class="card"><b>¿Necesitas ayuda con el portal?</b> Escríbele a tu contacto en Clazz Digital o abre un ticket. Estamos para ayudarte.</div>
  `},
];

const nav = document.getElementById("nav");
const article = document.getElementById("article");
const crumb = document.getElementById("crumb");
const pager = document.getElementById("pager");
const side = document.getElementById("side");
const scrim = document.getElementById("scrim");
SECTIONS.forEach((s, i) => {
  const b = document.createElement("button");
  b.className = "navlink"; b.dataset.id = s.id;
  b.innerHTML = '<span class="num">'+String(i+1).padStart(2,"0")+'</span>' + s.nav;
  b.onclick = () => { go(s.id); closeNav(); };
  nav.appendChild(b);
});
function go(id) {
  const i = Math.max(0, SECTIONS.findIndex((s) => s.id === id));
  const s = SECTIONS[i];
  article.innerHTML = "<h1>" + s.title + "</h1>" + s.html;
  crumb.innerHTML = "Guía del cliente › <b>" + s.nav + "</b>";
  document.querySelectorAll(".navlink").forEach((n) => n.classList.toggle("active", n.dataset.id === s.id));
  const prev = SECTIONS[i-1], next = SECTIONS[i+1];
  pager.innerHTML =
    (prev ? '<a href="#'+prev.id+'"><div class="lbl">‹ Anterior</div><div class="ttl">'+prev.nav+'</div></a>' : '<a class="empty"></a>') +
    (next ? '<a class="next" href="#'+next.id+'"><div class="lbl">Siguiente ›</div><div class="ttl">'+next.nav+'</div></a>' : '<a class="empty"></a>');
  if (location.hash !== "#"+s.id) history.replaceState(null,"","#"+s.id);
  window.scrollTo(0,0);
}
function openNav(){ side.classList.add("open"); scrim.classList.add("show"); }
function closeNav(){ side.classList.remove("open"); scrim.classList.remove("show"); }
document.getElementById("burger").onclick = openNav;
scrim.onclick = closeNav;
window.addEventListener("hashchange", () => go(location.hash.slice(1)));
go(location.hash.slice(1) || "bienvenida");
</script>
</body>
</html>
