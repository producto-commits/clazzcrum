<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Manual de Clazz — Guía paso a paso</title>
<link rel="icon" href="/clazz-logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0f1513; --surface:#16201b; --surface-2:#1c2823;
    --border:#243330; --border-strong:#31463f;
    --fg:#e9f1ed; --muted:#91a099;
    --brand:#2ec089; --brand-soft:rgba(46,192,137,.14); --brand-strong:#25a074;
    --danger:#f0656a; --warning:#e0a04a; --info:#4aa3e0;
    --radius:14px; --nav-w:310px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg); color:var(--fg);
    font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    line-height:1.65; font-size:15.5px; -webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{font-family:"Space Grotesk",Inter,sans-serif; line-height:1.2; letter-spacing:-.01em}
  a{color:var(--brand); text-decoration:none}
  a:hover{text-decoration:underline}
  code{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace; font-size:.84em;
    background:var(--surface-2); border:1px solid var(--border); padding:.06em .42em; border-radius:6px; color:#bfeeda; white-space:nowrap}

  .layout{display:flex; min-height:100vh}
  .side{width:var(--nav-w); flex:0 0 var(--nav-w); background:var(--surface); border-right:1px solid var(--border);
    position:sticky; top:0; height:100vh; overflow-y:auto; padding:22px 16px 40px}
  .brand{display:flex; align-items:center; gap:10px; padding:6px 8px 18px; border-bottom:1px solid var(--border); margin-bottom:10px}
  .brand img{width:34px;height:34px;border-radius:50%}
  .brand .n{font-family:"Space Grotesk";font-weight:700;font-size:18px;line-height:1}
  .brand .s{font-size:10px;letter-spacing:.22em;color:var(--muted);font-weight:600}
  .navgroup{margin:16px 6px 6px; font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
  .navlink{display:flex; align-items:center; gap:9px; width:100%; text-align:left; padding:8px 12px; border-radius:10px;
    color:var(--muted); font-size:14px; font-weight:500; background:none; border:none; cursor:pointer; font-family:inherit; transition:.15s; line-height:1.35}
  .navlink:hover{background:var(--surface-2); color:var(--fg); text-decoration:none}
  .navlink.active{background:var(--brand-soft); color:var(--brand); font-weight:600}
  .navlink .num{width:20px;flex:none;font-size:11px;font-weight:700;opacity:.6;font-family:"JetBrains Mono",monospace}

  .main{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center}
  .content{width:100%; max-width:840px; padding:38px 34px 90px}
  .crumb{font-size:12.5px;color:var(--muted);margin-bottom:10px}
  .crumb b{color:var(--brand);font-weight:600}
  .content h1{font-size:31px;margin:.1em 0 .3em}
  .content h2{font-size:20px;margin:1.9em 0 .5em}
  .content h3{font-size:16px;margin:1.4em 0 .3em;color:#cfe7dd}
  .content p{margin:.6em 0}
  .lead{font-size:17px;color:#c7d6ce}
  .content ul{margin:.5em 0 .9em; padding-left:1.2em}
  .content li{margin:.3em 0}
  .content img{width:100%;border-radius:var(--radius);border:1px solid var(--border-strong);margin:1em 0;
    box-shadow:0 10px 30px rgba(0,0,0,.35)}
  figure{margin:1.2em 0}
  figcaption{font-size:12.5px;color:var(--muted);text-align:center;margin-top:.5em}

  .callout{border-left:3px solid var(--brand);background:var(--brand-soft);border-radius:8px;padding:12px 16px;margin:1.1em 0;font-size:14.5px}
  .callout.warn{border-left-color:var(--warning);background:rgba(224,160,74,.10)}
  .callout.info{border-left-color:var(--info);background:rgba(74,163,224,.10)}
  .callout .t{font-weight:600;margin-bottom:2px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin:1.1em 0}

  table{width:100%;border-collapse:collapse;margin:1.1em 0;font-size:14px}
  th,td{border:1px solid var(--border);padding:9px 12px;text-align:left;vertical-align:top}
  th{background:var(--surface-2);font-weight:600;color:#cfe7dd}

  ol.steps{counter-reset:s;list-style:none;padding:0;margin:1.1em 0}
  ol.steps>li{counter-increment:s;position:relative;padding:3px 0 16px 44px;margin:0;border-left:1px solid var(--border);margin-left:13px}
  ol.steps>li:last-child{border-left:1px solid transparent}
  ol.steps>li::before{content:counter(s);position:absolute;left:-13px;top:0;width:26px;height:26px;border-radius:50%;
    background:var(--surface-2);color:var(--brand);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(46,192,137,.4)}
  .req{color:var(--warning);font-weight:600;font-size:12px}

  .pager{display:flex;justify-content:space-between;gap:12px;margin-top:44px;border-top:1px solid var(--border);padding-top:22px}
  .pager a{flex:1;display:block;padding:14px 16px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--fg)}
  .pager a:hover{border-color:var(--brand);text-decoration:none}
  .pager .lbl{font-size:11.5px;color:var(--muted)}
  .pager .ttl{font-weight:600;color:var(--brand);margin-top:2px;font-size:14px}
  .pager .next{text-align:right}
  .pager .empty{visibility:hidden}

  .topbar{display:none}
  @media (max-width:900px){
    .side{position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);transition:.25s;box-shadow:0 0 40px rgba(0,0,0,.6)}
    .side.open{transform:none}
    .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px}
    .burger{background:var(--surface-2);border:1px solid var(--border);color:var(--fg);border-radius:9px;padding:7px 11px;font-size:18px;cursor:pointer}
    .content{padding:24px 18px 70px}
    .content h1{font-size:25px}
    .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
    .scrim.show{display:block}
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="side" id="side">
    <div class="brand">
      <img src="/clazz-logo.png" alt="Clazz" />
      <div><div class="n">Clazz</div><div class="s">DIGITAL · MANUAL</div></div>
    </div>
    <nav id="nav"></nav>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <div class="topbar"><button class="burger" id="burger" aria-label="Menú">☰</button><strong>Manual de Clazz</strong></div>
    <div class="content">
      <div class="crumb" id="crumb"></div>
      <article id="article"></article>
      <div class="pager" id="pager"></div>
    </div>
  </div>
</div>

<script>
const IMG = "/doc/capturas/";
const img = (f,cap) => '<figure><img src="'+IMG+f+'" alt="'+cap+'"><figcaption>'+cap+'</figcaption></figure>';
const REQ = '<span class="req">(obligatorio)</span>';

const SECTIONS = [
  /* ===================== EMPEZAR ===================== */
  { id:"bienvenida", group:"Empezar", nav:"Bienvenida", title:"Bienvenida a Clazz", html:`
    <p class="lead">Esta guía es un <b>paso a paso</b> de cómo hacer cada cosa en Clazz: crear un proyecto, planear el trabajo, mover el tablero, atender un ticket, generar entregables y administrar tu equipo. Cada tarea trae capturas reales de la pantalla exacta.</p>
    <h2>Cómo está organizada</h2>
    <table>
      <tr><th>Bloque</th><th>Qué aprenderás a hacer</th></tr>
      <tr><td><b>El panel y tu día</b></td><td>Leer el panel y correr el Daily.</td></tr>
      <tr><td><b>Proyectos</b></td><td>Crear proyecto, armar hitos/fases/actividades, planear sprints, tablero, bloquear, completar, métricas.</td></tr>
      <tr><td><b>Coordinación</b></td><td>Programar reuniones.</td></tr>
      <tr><td><b>Soporte</b></td><td>Atender tickets con SLA.</td></tr>
      <tr><td><b>Entregables</b></td><td>Crear documentos y enviarlos a aprobación.</td></tr>
      <tr><td><b>Administración</b></td><td>Registrar clientes, crear el equipo y su capacidad, y saber qué ve el cliente.</td></tr>
    </table>
    <div class="callout"><div class="t">Lo que ves depende de tu rol</div><b>Administrador</b> y <b>Líder técnico</b> ven todo; el <b>Desarrollador</b> ve solo lo asignado; el <b>Cliente</b> entra a un portal aparte.</div>
  `},
  { id:"ingresar", group:"Empezar", nav:"Iniciar sesión", title:"Iniciar sesión", html:`
    <p>Tu administrador ya creó tu cuenta (queda lista sin verificación por correo).</p>
    ${img("01-login.png","Pantalla de inicio de sesión")}
    <ol class="steps">
      <li>Escribe tu <b>Correo electrónico</b>.</li>
      <li>Escribe tu <b>Contraseña</b>.</li>
      <li>Pulsa <code>Entrar</code>. Según tu rol llegarás al panel del equipo o al portal del cliente.</li>
    </ol>
    <div class="callout warn"><div class="t">¿Olvidaste tu contraseña?</div>Usa <code>¿Olvidaste tu contraseña?</code> para recibir un código y crear una nueva. Tras varios intentos fallidos la cuenta se bloquea un rato por seguridad.</div>
  `},

  /* ===================== EL PANEL Y TU DÍA ===================== */
  { id:"panel", group:"El panel y tu día", nav:"Leer el panel", title:"Leer el Panel", html:`
    <p>Es lo primero al entrar. Resume tu operación según tu rol.</p>
    ${img("02-panel.png","Panel principal con indicadores y gráficos")}
    <ul>
      <li><b>Tarjetas superiores:</b> Proyectos activos, Actividades en curso, Casos abiertos, Cumplimiento SLA y CSAT promedio.</li>
      <li><b>Actividades por estado</b> y <b>Casos por estado:</b> el reparto actual del trabajo y de los tickets.</li>
    </ul>
    <div class="callout"><div class="t">La campana 🔔</div>Arriba a la derecha te avisa de actividades que <b>vencen hoy o están vencidas</b> y de <b>casos nuevos</b>.</div>
  `},
  { id:"daily", group:"El panel y tu día", nav:"Correr el Daily", title:"Correr el Daily", html:`
    <p>La vista para la reunión diaria. Muestra, por persona, qué pasó el día que elijas. <span class="req">Solo administradores y líderes.</span></p>
    ${img("08-daily.png","Daily navegable por fecha, centrado en cada desarrollador")}
    <ol class="steps">
      <li>Elige el día con las flechas <code>‹</code> <code>›</code>, el selector de fecha o el atajo <code>Ayer</code>.</li>
      <li>Mira la barra de <b>totales</b>: Ejecutadas · En ejecución · Bloqueadas.</li>
      <li>Si buscas a alguien, escribe en <code>Filtrar por desarrollador, cargo o proyecto…</code>.</li>
      <li>En cada tarjeta de persona revisa: <b>sus proyectos</b> (con avance), lo <b>ejecutado</b> ese día, lo que tiene <b>en ejecución</b> y sus <b>bloqueos</b> (con motivo y días bloqueada).</li>
    </ol>
  `},

  /* ===================== PROYECTOS ===================== */
  { id:"crear-proyecto", group:"Proyectos", nav:"Crear un proyecto", title:"Crear un proyecto", html:`
    <p>Cada proyecto pertenece a un cliente. Se crea desde la ficha del cliente. <span class="req">Solo administradores y líderes técnicos.</span></p>
    <ol class="steps">
      <li>Ve a <code>Clientes</code> y entra al cliente (o créalo, ver <a href="#clientes">Registrar un cliente</a>).</li>
      <li>En la sección <b>Proyectos</b>, pulsa <code>+ Nuevo proyecto</code>.</li>
      <li>Escribe el <b>Nombre del proyecto</b> ${REQ} — por ejemplo un área: <i>Sitio web, App móvil…</i></li>
      <li>Opcional: una <b>Descripción</b>.</li>
      <li>Pulsa <code>Crear proyecto</code>.</li>
    </ol>
    ${img("27-modal-nuevo-proyecto.png","Modal “Nuevo proyecto”")}
    <div class="callout">Un mismo cliente puede tener <b>varios proyectos</b>, uno por área. Luego entra al proyecto para armar su estructura.</div>
  `},
  { id:"estructura", group:"Proyectos", nav:"Armar la estructura", title:"Armar la estructura: Hitos ▸ Fases ▸ Actividades", html:`
    <p>Clazz organiza el trabajo en tres niveles. Tú defines el <b>qué</b>; el sistema calcula el <b>cuándo</b>.</p>
    <table>
      <tr><th>Nivel</th><th>Qué es</th></tr>
      <tr><td><b>Hito</b></td><td>Un gran bloque del proyecto (código automático <code>H-01</code>, <code>H-02</code>…).</td></tr>
      <tr><td><b>Fase</b></td><td>Una etapa dentro de un hito.</td></tr>
      <tr><td><b>Actividad</b></td><td>La tarea concreta: responsable, horas y estado.</td></tr>
    </table>
    ${img("21-panel-actividad.png","Pestaña Estructura: hitos con sus fases y actividades")}
    <h2>1) Crear un hito</h2>
    <ol class="steps">
      <li>En la pestaña <code>Estructura</code>, pulsa <code>+ Nuevo hito</code>.</li>
      <li>Escribe el <b>Nombre</b> ${REQ} (el código <code>H-01</code> se pone solo).</li>
      <li>Opcional: <b>Objetivo</b>. Define <b>Inicio</b> ${REQ} y <b>Fin</b> ${REQ}.</li>
      <li>Pulsa <code>Crear hito</code>.</li>
    </ol>
    <h2>2) Agregar fases y actividades</h2>
    <ol class="steps">
      <li>Dentro de un hito, pulsa <code>+ Fase</code>, escribe el título y <code>Agregar</code>.</li>
      <li>Dentro de una fase, pulsa <code>+ Actividad</code> para crearla en línea (o usa <code>+ Actividad</code> del encabezado, ver la sección siguiente).</li>
    </ol>
    <div class="callout"><div class="t">Barra “Avance del proyecto”</div>Arriba verás el % completado y <code>{done} de {total} actividades completadas</code>, y cada hito y fase con su propio progreso.</div>
    <div class="callout warn"><div class="t">Eliminar</div>Solo admin/líder. Borrar una fase <b>no borra</b> sus actividades: quedan “sin fase”.</div>
  `},
  { id:"crear-actividad", group:"Proyectos", nav:"Crear una actividad", title:"Crear una actividad", html:`
    <p>La actividad es la unidad de trabajo. Puedes crearla en línea dentro de una fase o con el botón del encabezado.</p>
    <ol class="steps">
      <li>Dentro del proyecto, pulsa <code>+ Actividad</code> (arriba a la derecha).</li>
      <li><b>Título</b> ${REQ} — ej: <i>Login con Google</i>.</li>
      <li><b>Prioridad</b>: Baja / Media / Alta / Crítica (por defecto Media).</li>
      <li><b>Horas estimadas</b> — importante: el motor las usa para calcular fechas.</li>
      <li>Asígnala a una <b>Fase</b> y/o un <b>Hito</b> (o déjala en <code>— backlog —</code>).</li>
      <li>Pulsa <code>Crear actividad</code>.</li>
    </ol>
    ${img("20-modal-nueva-actividad.png","Modal “Nueva actividad”")}
    <div class="callout info"><div class="t">Para que entre a la planeación</div>Una actividad necesita <b>responsable</b> y <b>horas estimadas</b>. El responsable se asigna desde el panel de detalle (siguiente sección). Sin eso, queda fuera del cálculo de sprints.</div>
  `},
  { id:"detalle-actividad", group:"Proyectos", nav:"Detalle de la actividad", title:"Ver y editar una actividad", html:`
    <p>Haz clic en cualquier actividad (en la estructura o en el tablero) para abrir su panel de detalle.</p>
    ${img("21-panel-actividad.png","Clic en una actividad para abrir su panel de detalle")}
    <p>En el panel puedes editar:</p>
    <ul>
      <li><b>Título</b> y <b>Descripción</b>.</li>
      <li><b>Estado</b>, <b>Prioridad</b>, <b>Fase</b>, <b>Hito</b>, <b>Horas estimadas</b> y <b>Horas reales</b>.</li>
      <li><b>Responsable(s)</b> (toca los chips), <b>Etiquetas</b>, <b>Criterios de aceptación (DoD)</b>, <b>Subtareas</b>, <b>Adjuntos</b> y <b>Comentarios</b>.</li>
      <li>Pulsa <code>Guardar cambios</code>.</li>
    </ul>
    <div class="callout"><div class="t">Fechas calculadas</div><code>Inicio probable</code> y <code>Cierre probable</code> son de solo lectura: los pone el motor de planificación, no se editan a mano.</div>
    <div class="callout warn"><div class="t">Zona de eliminar</div>Solo admin/líder ve el botón <code>Eliminar</code> al final del panel.</div>
  `},
  { id:"sprints", group:"Proyectos", nav:"Planear y generar sprints", title:"Planear y generar sprints", html:`
    <p>Aquí está la magia: tú das horas, responsables y fecha de inicio; Clazz calcula las fechas de cada actividad, el fin del proyecto y <b>genera los sprints solo</b>.</p>
    ${img("05-proyecto-sprints.png","Pestaña Sprints: cronograma y sprints automáticos (lunes→domingo)")}
    <ol class="steps">
      <li>Entra a la pestaña <code>Sprints</code>.</li>
      <li>Ajusta la fecha de <b>Inicio</b> del proyecto.</li>
      <li>Define <b>Sprint (semanas, lun→dom)</b> — cuántas semanas dura cada sprint (1 a 12).</li>
      <li>Pulsa <code>Replanificar</code>.</li>
      <li>Revisa el resultado: <b>Fin estimado (calculado)</b> y cada <b>Sprint</b> con sus hitos, actividades y fechas.</li>
    </ol>
    <h2>Qué tiene en cuenta el cálculo</h2>
    <ul>
      <li><b>Capacidad</b> de cada persona: horas/día × % de dedicación al proyecto.</li>
      <li><b>Fines de semana y festivos de Colombia</b> (se excluyen).</li>
      <li><b>Reuniones y tickets resueltos</b>, que restan capacidad y corren las fechas.</li>
    </ul>
    <div class="callout warn"><div class="t">Aviso de pendientes</div>Si ves <code>⚠ N actividad(es) sin responsable o sin horas estimadas</code>, complétalas y vuelve a <code>Replanificar</code>: sin eso no entran al cálculo.</div>
  `},
  { id:"tablero", group:"Proyectos", nav:"Trabajar en el tablero", title:"Trabajar en el Tablero (Kanban)", html:`
    <p>La vista para mover el trabajo día a día. Arrastra las tarjetas entre columnas.</p>
    ${img("06-proyecto-tablero.png","Tablero Kanban por estado")}
    <h3>Columnas</h3>
    <p>Backlog · Planeado · En ejecución · En pruebas / QA · Bloqueado · Completado.</p>
    <h3>Filtrar</h3>
    <ul>
      <li>Busca por texto, o filtra por <b>hito</b>, <b>asignado</b>, <b>prioridad</b> y <b>período</b> (<code>Hoy</code>/<code>Esta semana</code>/<code>Este mes</code>).</li>
      <li>En <code>Estados:</code> activa o desactiva las columnas que quieres ver.</li>
    </ul>
    <div class="callout"><div class="t">Atajos al arrastrar</div>Soltar una tarjeta en <b>Completado</b> abre la ventana de <a href="#completar">completar con evidencia</a>; soltarla en <b>Bloqueado</b> pide el <a href="#bloquear">motivo del bloqueo</a>.</div>
  `},
  { id:"bloquear", group:"Proyectos", nav:"Bloquear / desbloquear", title:"Bloquear y desbloquear una actividad", html:`
    <p>Cuando algo detiene una actividad, bloquéala con su motivo. Clazz cuenta los días de bloqueo solo.</p>
    <ol class="steps">
      <li>Abre la actividad (o arrástrala a <b>Bloqueado</b> en el tablero).</li>
      <li>Cambia el <b>Estado</b> a <code>Bloqueado</code>: se abre la ventana <b>Bloquear actividad</b>.</li>
      <li>Escribe el <b>Motivo del bloqueo</b> ${REQ} — ej: <i>Esperando acceso al servidor del cliente</i>.</li>
      <li>Pulsa <code>Bloquear</code>.</li>
    </ol>
    ${img("23-modal-bloquear.png","Ventana “Bloquear actividad” con el motivo obligatorio")}
    <div class="callout"><div class="t">Desbloquear</div>Cuando se resuelva, cambia el estado de vuelta (ej. a <b>En ejecución</b>). Los <b>días en bloqueo</b> quedan registrados y se ven en el panel y en el <a href="#daily">Daily</a>.</div>
  `},
  { id:"completar", group:"Proyectos", nav:"Completar con evidencia", title:"Completar una actividad (con evidencia)", html:`
    <p>Para cerrar una actividad, Clazz exige evidencia del trabajo. Así queda trazabilidad.</p>
    <ol class="steps">
      <li>Abre la actividad y pulsa <code>✓ Marcar completada</code> (o arrástrala a <b>Completado</b>).</li>
      <li><b>Horas reales</b> ${REQ} — cuántas horas tomó de verdad.</li>
      <li>La <b>Fecha de finalización</b> se pone sola (hoy).</li>
      <li><b>Descripción de la evidencia</b> ${REQ} — qué se hizo y cómo se validó.</li>
      <li><b>Adjunto de evidencia</b> ${REQ} — una imagen, PDF o documento (máx. 15 MB).</li>
      <li>Pulsa <code>Marcar como completada</code>.</li>
    </ol>
    ${img("22-modal-completar.png","Ventana “Completar actividad”: horas, evidencia y adjunto obligatorios")}
    <div class="callout warn">Sin las horas, la descripción <b>y</b> el adjunto, el sistema no deja completar.</div>
  `},
  { id:"metricas", group:"Proyectos", nav:"Ver métricas", title:"Ver las métricas del proyecto", html:`

  { id:"mesa", group:"Soporte", nav:"Atender un ticket", title:"Atender un ticket (mesa de servicio)", html:`

const nav = document.getElementById("nav");
const article = document.getElementById("article");
const crumb = document.getElementById("crumb");
const pager = document.getElementById("pager");
const side = document.getElementById("side");
const scrim = document.getElementById("scrim");

let lastGroup = null, idx = 0;
SECTIONS.forEach((s, i) => {
  if (s.group !== lastGroup) {
    const g = document.createElement("div");
    g.className = "navgroup"; g.textContent = s.group;
    nav.appendChild(g); lastGroup = s.group; idx = 0;
  }
  const b = document.createElement("button");
  b.className = "navlink"; b.dataset.id = s.id;
  b.innerHTML = '<span class="num">'+String(i+1).padStart(2,"0")+'</span>' + s.nav;
  b.onclick = () => { go(s.id); closeNav(); };
  nav.appendChild(b);
});

function go(id) {
  const i = Math.max(0, SECTIONS.findIndex((s) => s.id === id));
  const s = SECTIONS[i];
  article.innerHTML = "<h1>" + s.title + "</h1>" + s.html;
  crumb.innerHTML = "Manual de Clazz › <span style='color:var(--muted)'>" + s.group + "</span> › <b>" + s.nav + "</b>";
  document.querySelectorAll(".navlink").forEach((n) => n.classList.toggle("active", n.dataset.id === s.id));
  const prev = SECTIONS[i-1], next = SECTIONS[i+1];
  pager.innerHTML =
    (prev ? '<a href="#'+prev.id+'"><div class="lbl">‹ Anterior</div><div class="ttl">'+prev.nav+'</div></a>' : '<a class="empty"></a>') +
    (next ? '<a class="next" href="#'+next.id+'"><div class="lbl">Siguiente ›</div><div class="ttl">'+next.nav+'</div></a>' : '<a class="empty"></a>');
  if (location.hash !== "#"+s.id) history.replaceState(null,"","#"+s.id);
  window.scrollTo(0,0);
}
function openNav(){ side.classList.add("open"); scrim.classList.add("show"); }
function closeNav(){ side.classList.remove("open"); scrim.classList.remove("show"); }
document.getElementById("burger").onclick = openNav;
scrim.onclick = closeNav;
window.addEventListener("hashchange", () => go(location.hash.slice(1)));
go(location.hash.slice(1) || "bienvenida");
</script>
